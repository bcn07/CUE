<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CUE Camera</title>
<style>
  :root{--ok:#2ecc71;--warn:#f5b342;--bad:#ff3b3b}
  html,body{height:100%}
  body{margin:0;background:#000;color:#e8edf2;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  #stage{position:relative;flex:1;min-height:0;background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #frame{position:absolute;border:2px solid rgba(46,204,113,.9);box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none;display:none}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#14181d;border-top:1px solid #2a323c;flex-wrap:wrap;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .bar b{color:#ff3b3b}
  .st{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#93a1b1;flex-basis:100%}
  button,select{background:#1b2129;color:#e8edf2;border:1px solid #2a323c;border-radius:8px;padding:10px 14px;font-size:15px}
  button.primary{background:#ff3b3b;border-color:#ff3b3b;color:#fff;font-weight:700}
  .badge{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:5px;font-weight:700;letter-spacing:.1em;font-size:13px;background:#333;color:#aaa}
  .badge.live{background:var(--ok);color:#04140a} .badge.standby{background:var(--warn);color:#111} .badge.offline{background:var(--bad);color:#fff}
  .warn{background:#3a2a00;color:#ffd27a;padding:10px 14px;font-size:13px}
  .warn.err{background:#5a1d1d;color:#ffd6d6}
</style>
</head>
<body>
<div class="warn" id="warn" style="display:none"></div>
<div id="stage">
  <video id="v" autoplay playsinline muted></video>
  <div id="frame"></div>
  <div class="badge offline" id="badge">OFFLINE</div>
</div>
<div class="bar">
  <span>CUE camera <b id="camId"></b></span>
  <select id="devices"><option value="">rear camera</option></select>
  <button id="start" class="primary">Start</button>
  <span class="st" id="st">idle · tap Start, allow the camera</span>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const cam = (q.get('cam') || 'B').toUpperCase();
  const code = q.get('code') || '';
  const label = q.get('label') || '';
  const fps = Math.min(30, Math.max(1, +(q.get('fps') || 15)));
  const W = +(q.get('w') || 960), H = +(q.get('h') || 540), Q = +(q.get('q') || 0.6);   // sent size; phones capture full-res and crop (virtual PTZ)
  const $ = (id) => document.getElementById(id);
  $('camId').textContent = cam;
  const v = $('v'), st = $('st'), sel = $('devices'), warn = $('warn'), btn = $('start'), badge = $('badge'), frameBox = $('frame');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const showWarn = (html, err) => { warn.style.display = 'block'; warn.className = 'warn' + (err ? ' err' : ''); warn.innerHTML = html; };
  const setBadge = (s) => { badge.className = 'badge ' + s.toLowerCase(); badge.textContent = s; };
  if (!code) showWarn('No join code in the address. Ask the director for the link on their setup page (it ends with <code>&amp;code=123456</code>).', true);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showWarn(location.protocol === 'https:' ? 'This browser does not expose the camera.' : `Cameras need HTTPS on phones. Use the director's <b>https://…trycloudflare.com</b> link, not <code>${esc(location.origin)}</code>.`, true);
  }
  // ---- virtual PTZ: a crop window (x,y = centre in 0..1, zoom 1..3) eased over 400 ms
  const ptz = { x: 0.5, y: 0.5, zoom: 1 }, target = { x: 0.5, y: 0.5, zoom: 1 };
  let easeFrom = null, easeStart = 0;
  function setTarget(t) { easeFrom = { ...ptz }; easeStart = performance.now(); target.x = Math.min(1, Math.max(0, +t.x)); target.y = Math.min(1, Math.max(0, +t.y)); target.zoom = Math.min(3, Math.max(1, +t.zoom)); }
  function stepPtz(now) {
    if (!easeFrom) return;
    const k = Math.min(1, (now - easeStart) / 400), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    ptz.x = easeFrom.x + (target.x - easeFrom.x) * e; ptz.y = easeFrom.y + (target.y - easeFrom.y) * e; ptz.zoom = easeFrom.zoom + (target.zoom - easeFrom.zoom) * e;
    if (k >= 1) easeFrom = null;
  }
  function cropRect(vw, vh) {  // window of the source frame at the sent aspect, clamped inside the frame
    const aspect = W / H; let cw = vw / ptz.zoom, ch = cw / aspect;
    if (ch > vh) { ch = vh / ptz.zoom; cw = ch * aspect; }
    const cx = Math.min(vw - cw / 2, Math.max(cw / 2, ptz.x * vw)), cy = Math.min(vh - ch / 2, Math.max(ch / 2, ptz.y * vh));
    return { sx: cx - cw / 2, sy: cy - ch / 2, sw: cw, sh: ch };
  }
  function drawFrameBox() {
    const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !running) { frameBox.style.display = 'none'; return; }
    const r = cropRect(vw, vh), box = v.getBoundingClientRect(), s = Math.min(box.width / vw, box.height / vh);
    const ox = box.left + (box.width - vw * s) / 2, oy = box.top + (box.height - vh * s) / 2;
    frameBox.style.display = (ptz.zoom > 1.01 || Math.abs(ptz.x - .5) > .01 || Math.abs(ptz.y - .5) > .01) ? 'block' : 'none';
    frameBox.style.left = (ox + r.sx * s) + 'px'; frameBox.style.top = (oy + r.sy * s) + 'px'; frameBox.style.width = (r.sw * s) + 'px'; frameBox.style.height = (r.sh * s) + 'px';
  }
  // ---- devices: iOS only reveals labels after permission; default to the rear (environment) camera
  async function listDevices() {
    try {
      const ds = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
      const cur = sel.value;
      sel.innerHTML = '<option value="">rear camera (default)</option>' + ds.map((d, i) => `<option value="${esc(d.deviceId)}">${esc(d.label || 'camera ' + (i + 1))}</option>`).join('');
      sel.value = cur;
    } catch (e) {}
  }
  listDevices();
  // ---- streaming
  let ws = null, running = false, stream = null, sending = false, frames = 0, bytes = 0, t0 = performance.now(), lastSent = 0, wakeLock = null, standby = false;
  function wsUrl() {
    let u = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ingest?cam=${encodeURIComponent(cam)}&code=${encodeURIComponent(code)}`;
    if (label) u += `&label=${encodeURIComponent(label)}`;
    return u;
  }
  function connect() {
    if (!running) return;
    ws = new WebSocket(wsUrl());
    ws.onopen = () => { standby = false; setBadge('LIVE'); const hello = { type: 'hello', cam, width: W, height: H, fps }; if (label) hello.label = label; ws.send(JSON.stringify(hello)); };
    ws.onmessage = (ev) => {
      let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
      if (j.type === 'ptz') setTarget(j);
      else if (j.type === 'standby') { standby = true; setBadge('STANDBY'); showWarn('Another device is live on camera ' + cam + '. Waiting for the director to approve this one.', false); }
      else if (j.type === 'error') { showWarn(esc(j.error), true); if (/join code/.test(j.error)) { running = false; btn.textContent = 'Start'; } }
      else if (j.type === 'ack') { warn.style.display = 'none'; standby = false; setBadge('LIVE'); }
    };
    ws.onclose = () => { ws = null; if (running) { setBadge('OFFLINE'); setTimeout(connect, 1000); } };
  }
  const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
  function pump(now) {
    if (!running) return;
    stepPtz(now);
    if (ws && ws.readyState === 1 && !standby && !sending && ws.bufferedAmount < 400000 && now - lastSent >= 1000 / fps - 2 && v.videoWidth) {
      sending = true; lastSent = now;
      const r = cropRect(v.videoWidth, v.videoHeight);
      ctx.drawImage(v, r.sx, r.sy, r.sw, r.sh, 0, 0, W, H);
      c.toBlob((b) => { if (b && ws && ws.readyState === 1 && !standby) { ws.send(b); frames++; bytes += b.size; } sending = false; }, 'image/jpeg', Q);
    }
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => pump(performance.now())); else setTimeout(() => pump(performance.now()), 1000 / fps / 2);
  }
  setInterval(drawFrameBox, 100);
  async function keepAwake() { try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {} }
  document.addEventListener('visibilitychange', async () => {
    if (!running) return;
    if (document.hidden) { setBadge('OFFLINE'); showWarn('Keep this page in the foreground: iOS pauses the camera in the background.', true); }
    else { warn.style.display = 'none'; await keepAwake(); if (stream && stream.getVideoTracks()[0]?.readyState !== 'live') await startStream(); }
  });
  async function startStream() {
    const constraints = { video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 }, ...(sel.value ? { deviceId: { exact: sel.value } } : { facingMode: { ideal: 'environment' } }) }, audio: false };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    v.srcObject = stream; await v.play();
    stream.getVideoTracks()[0].onended = () => { if (running) { setBadge('OFFLINE'); showWarn('Camera stopped (call, lock screen or another app). Tap Start again if it does not resume.', true); } };
  }
  sel.onchange = async () => { if (running) { try { await startStream(); } catch (e) { showWarn('Lens switch failed: ' + esc(e.message), true); } } };
  btn.onclick = async () => {
    if (running) { running = false; btn.textContent = 'Start'; if (ws) ws.close(); if (stream) stream.getTracks().forEach((t) => t.stop()); setBadge('OFFLINE'); st.textContent = 'stopped'; return; }
    try { await startStream(); } catch (e) { showWarn(`Camera error: ${esc(e.name)}: ${esc(e.message)} (permission denied, camera in use, or not HTTPS)`, true); return; }
    await listDevices(); await keepAwake();
    running = true; btn.textContent = 'Stop'; warn.style.display = 'none';
    connect(); pump(performance.now());
    setInterval(() => { if (!running) return; const dt = (performance.now() - t0) / 1000; st.textContent = `${(frames / dt).toFixed(1)} fps · ${(bytes * 8 / dt / 1000).toFixed(0)} kb/s · ${v.videoWidth}x${v.videoHeight} in → ${W}x${H} out · zoom ${ptz.zoom.toFixed(1)}x · ${ws && ws.readyState === 1 ? (standby ? 'standby' : 'connected') : 'reconnecting'}`; frames = 0; bytes = 0; t0 = performance.now(); }, 2000);
  };
})();
</script>
</body>
</html>
